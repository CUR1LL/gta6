name: gta6-clips
on:
  schedule:
    - cron: "0 9 * * *"      # каждый день в 12:00 по Москве
  workflow_dispatch:          # ручной запуск кнопкой
jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Журнал обработанных клипов
        uses: actions/cache@v4
        with:
          path: processed.json
          key: processed-${{ github.run_id }}
          restore-keys: processed-
      - name: Кэш модели субтитров
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base
      - name: ffmpeg и шрифты
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Зависимости Python
        run: pip install requests yt-dlp faster-whisper
      - name: Фабрика клипов
        run: python gta6_factory.py
        env:
          TWITCH_ID: ${{ secrets.TWITCH_ID }}
          TWITCH_SECRET: ${{ secrets.TWITCH_SECRET }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
